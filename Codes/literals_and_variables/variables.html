<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Variables</h1>

<p>In this example, x, y, and z are undeclared.</p>
<p>They are automatically declared when first used.</p>

<p id="demo"></p>

<script>
const x = 5;
y=x+5;
document.getElementById("demo").innerHTML =
"The value of y is: " + y;
</script>

</body>
</html>
